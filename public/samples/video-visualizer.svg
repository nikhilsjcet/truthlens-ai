<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#videoBg)"/>

  <!-- Cybernetic Grid Backdrop -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="80" x2="920" y2="80"/>
    <line x1="80" y1="180" x2="920" y2="180"/>
    <line x1="80" y1="280" x2="920" y2="280"/>
    <line x1="80" y1="380" x2="920" y2="380"/>
    <line x1="80" y1="480" x2="920" y2="480"/>
    <line x1="180" y1="80" x2="180" y2="480"/>
    <line x1="360" y1="80" x2="360" y2="480"/>
    <line x1="540" y1="80" x2="540" y2="480"/>
    <line x1="720" y1="80" x2="720" y2="480"/>
    <line x1="900" y1="80" x2="900" y2="480"/>
  </g>

  <!-- Film Frame Viewport Border -->
  <rect x="120" y="70" width="760" height="420" rx="10" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Target Face Outline (Abstract Forensic Silhouette) -->
  <ellipse cx="500" cy="270" rx="140" ry="170" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  
  <!-- Facial Landmark Mesh (Deepfake Tracking Nodes) -->
  <!-- Forehead -->
  <circle cx="500" cy="160" r="4" fill="#38bdf8"/>
  <circle cx="450" cy="180" r="3" fill="#38bdf8"/>
  <circle cx="550" cy="180" r="3" fill="#38bdf8"/>
  <!-- Eyes -->
  <circle cx="440" cy="230" r="5" fill="#38bdf8"/>
  <circle cx="560" cy="230" r="5" fill="#38bdf8"/>
  <line x1="420" y1="230" x2="460" y2="230" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="540" y1="230" x2="580" y2="230" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Nose bridge -->
  <circle cx="500" cy="260" r="4" fill="#818cf8"/>
  <circle cx="500" cy="290" r="4" fill="#818cf8"/>
  <!-- Lip contour (desync zone) -->
  <path d="M 450 340 Q 500 325 550 340 Q 500 365 450 340 Z" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="450" cy="340" r="4" fill="#f43f5e"/>
  <circle cx="550" cy="340" r="4" fill="#f43f5e"/>
  <circle cx="500" cy="335" r="3" fill="#f43f5e"/>
  <circle cx="500" cy="355" r="3" fill="#f43f5e"/>
  <!-- Jawline points -->
  <circle cx="390" cy="320" r="3" fill="#a855f7"/>
  <circle cx="430" cy="390" r="3" fill="#a855f7"/>
  <circle cx="500" cy="420" r="4" fill="#a855f7"/>
  <circle cx="570" cy="390" r="3" fill="#a855f7"/>
  <circle cx="610" cy="320" r="3" fill="#a855f7"/>

  <!-- Optical Flow Tracking Vectors (Mesh Links) -->
  <g stroke="url(#meshGrad)" stroke-width="1" opacity="0.65">
    <line x1="500" y1="160" x2="440" y2="230"/>
    <line x1="500" y1="160" x2="560" y2="230"/>
    <line x1="440" y1="230" x2="500" y2="260"/>
    <line x1="560" y1="230" x2="500" y2="260"/>
    <line x1="500" y1="260" x2="500" y2="290"/>
    <line x1="500" y1="290" x2="450" y2="340"/>
    <line x1="500" y1="290" x2="550" y2="340"/>
    <line x1="450" y1="340" x2="500" y2="420"/>
    <line x1="550" y1="340" x2="500" y2="420"/>
  </g>

  <!-- Deepfake Face-Swap Bounding Box (Jitter Anomaly) -->
  <rect x="330" y="120" width="340" height="320" rx="6" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Corner Crosshairs -->
  <path d="M 320 135 L 320 110 L 345 110" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <path d="M 680 135 L 680 110 L 655 110" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <path d="M 320 425 L 320 450 L 345 450" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <path d="M 680 425 L 680 450 L 655 450" fill="none" stroke="#f43f5e" stroke-width="3"/>

  <!-- Anomaly Alert Pill -->
  <rect x="345" y="130" width="190" height="26" rx="4" fill="#f43f5e" fill-opacity="0.9"/>
  <text x="355" y="148" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">! TEMPORAL JITTER: 140ms</text>

  <!-- Lip-sync Warning Pill -->
  <rect x="425" y="375" width="150" height="22" rx="4" fill="#000000" fill-opacity="0.85" stroke="#f43f5e" stroke-width="1"/>
  <text x="435" y="390" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold">VISEME-AUDIO LAG</text>

  <!-- Title Badge Top-Left -->
  <rect x="140" y="85" width="310" height="52" rx="6" fill="#000000" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
  <text x="155" y="110" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">TEMPORAL FRAME TRACKER</text>
  <text x="155" y="127" fill="#94a3b8" font-family="monospace" font-size="11">Frame 0348/1200 • 29.97 FPS H.264</text>

  <!-- Timeline Strip Bottom -->
  <rect x="120" y="510" width="760" height="50" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
  <!-- Keyframe ticks -->
  <g stroke="#334155" stroke-width="1">
    <line x1="160" y1="520" x2="160" y2="550"/>
    <line x1="220" y1="525" x2="220" y2="545"/>
    <line x1="280" y1="520" x2="280" y2="550"/>
    <line x1="340" y1="525" x2="340" y2="545"/>
    <line x1="400" y1="520" x2="400" y2="550"/>
    <line x1="460" y1="525" x2="460" y2="545"/>
    <line x1="520" y1="520" x2="520" y2="550"/>
    <line x1="580" y1="525" x2="580" y2="545"/>
    <line x1="640" y1="520" x2="640" y2="550"/>
    <line x1="700" y1="525" x2="700" y2="545"/>
    <line x1="760" y1="520" x2="760" y2="550"/>
    <line x1="820" y1="525" x2="820" y2="545"/>
  </g>
  <!-- Anomaly Range on Timeline -->
  <rect x="420" y="522" width="160" height="26" rx="4" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1"/>
  <text x="440" y="539" fill="#fca5a5" font-family="monospace" font-size="10">SYNTHETIC WARP ZONE</text>
  <!-- Playhead -->
  <line x1="490" y1="505" x2="490" y2="565" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="485,505 495,505 490,515" fill="#38bdf8"/>
</svg>
