<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="pressHall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Press Conference Room -->
  <rect width="1200" height="800" fill="url(#pressHall)"/>

  <!-- Press backdrop curtain with folds -->
  <path d="M0,0 L1200,0 L1200,500 L0,500 Z" fill="#1e1b4b" opacity="0.6"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#0f172a" stroke-width="8"/>
  <line x1="450" y1="0" x2="450" y2="500" stroke="#0f172a" stroke-width="8"/>
  <line x1="750" y1="0" x2="750" y2="500" stroke="#0f172a" stroke-width="8"/>
  <line x1="1000" y1="0" x2="1000" y2="500" stroke="#0f172a" stroke-width="8"/>

  <!-- Microphones & Stage Desk -->
  <rect x="250" y="520" width="700" height="280" rx="12" fill="url(#podiumGrad)"/>
  
  <!-- Left Speaker (Authentic original subject) -->
  <ellipse cx="450" cy="400" rx="70" ry="90" fill="#cbd5e1"/>
  <path d="M370,490 Q450,460 530,490 L550,600 L350,600 Z" fill="#0f172a"/>
  
  <!-- SPLICED / MANIPULATED OBJECT: Inset trophy / altered briefcase with artificial boundary halo -->
  <!-- Tampering glow boundary indicator -->
  <rect x="680" y="440" width="220" height="230" rx="10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Spliced Object with mismatched lighting -->
  <polygon points="790,460 740,570 840,570" fill="#f59e0b"/>
  <rect x="760" y="570" width="60" height="80" fill="#d97706"/>
  
  <!-- Mismatched drop shadow (points wrong direction) -->
  <ellipse cx="880" cy="655" rx="80" ry="12" fill="#000000" opacity="0.8"/> <!-- Incorrect angle -->

  <!-- Boundary feathering artifacts -->
  <path d="M685,445 L895,445 L895,665 L685,665 Z" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>

  <!-- Microphones -->
  <line x1="560" y1="520" x2="540" y2="440" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="540" cy="435" r="8" fill="#475569"/>
  
  <line x1="640" y1="520" x2="660" y2="440" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="660" cy="435" r="8" fill="#475569"/>

  <!-- Telemetry Badge -->
  <rect x="30" y="30" width="380" height="70" rx="8" fill="#000000" fill-opacity="0.7"/>
  <text x="50" y="60" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="bold">ELA SPLICING & INPAINTING</text>
  <text x="50" y="82" fill="#94a3b8" font-family="monospace" font-size="13">Dual Compression Matrix • Adobe XMP Tag</text>
</svg>
