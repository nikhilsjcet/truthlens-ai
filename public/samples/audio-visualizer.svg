<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#audioBg)"/>

  <!-- Spectral Grid -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1">
    <line x1="100" y1="100" x2="900" y2="100"/>
    <line x1="100" y1="200" x2="900" y2="200"/>
    <line x1="100" y1="300" x2="900" y2="300"/>
    <line x1="100" y1="400" x2="900" y2="400"/>
    <line x1="100" y1="500" x2="900" y2="500"/>
    <line x1="100" y1="100" x2="100" y2="500"/>
    <line x1="300" y1="100" x2="300" y2="500"/>
    <line x1="500" y1="100" x2="500" y2="500"/>
    <line x1="700" y1="100" x2="700" y2="500"/>
    <line x1="900" y1="100" x2="900" y2="500"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="380" height="60" rx="8" fill="#000000" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1"/>
  <text x="70" y="70" fill="#c084fc" font-family="monospace" font-size="16" font-weight="bold">VOCODER SPECTROGRAM AUDIT</text>
  <text x="70" y="90" fill="#94a3b8" font-family="monospace" font-size="12">Neural Voice Synthesis • 44.1kHz PCM</text>

  <!-- Center Frequency Waveform -->
  <path d="M 100 300 
           Q 130 180, 160 300 
           T 220 300 
           Q 250 80, 280 300 
           T 340 300 
           Q 370 120, 400 300 
           T 460 300 
           Q 490 60, 520 300 
           T 580 300 
           Q 610 140, 640 300 
           T 700 300 
           Q 730 90, 760 300 
           T 820 300 
           Q 850 200, 880 300" 
        fill="none" stroke="url(#waveGrad)" stroke-width="4" filter="drop-shadow(0 0 12px #8b5cf6)"/>

  <!-- Mirror Lower Waveform -->
  <path d="M 100 300 
           Q 130 420, 160 300 
           T 220 300 
           Q 250 520, 280 300 
           T 340 300 
           Q 370 480, 400 300 
           T 460 300 
           Q 490 540, 520 300 
           T 580 300 
           Q 610 460, 640 300 
           T 700 300 
           Q 730 510, 760 300 
           T 820 300 
           Q 850 400, 880 300" 
        fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Anomaly Indicator Box -->
  <rect x="470" y="80" width="160" height="380" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="480" y="110" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">! PITCH QUANTIZATION</text>

  <!-- Playhead Laser Line -->
  <line x1="550" y1="80" x2="550" y2="520" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="550" cy="300" r="6" fill="#22d3ee"/>
</svg>
